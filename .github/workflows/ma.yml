name: myfirstpipeline

on:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout external public repo
        uses: actions/checkout@v4
        with:
          repository: GEETHA9999/DevOPS-
          ref: master
          path: external-repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME2 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./external-repo
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME2 }}/my-app:latest

      - name: List files to verify
        run: ls -R external-repo 
